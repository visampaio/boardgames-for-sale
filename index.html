<!DOCTYPE html>
<html>
<head>
  <title>Boardgames for Sale</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <aside>
      <p id="lastDate">Last updated: </p>
      <hr>
      <button onclick="generateImage()">Download as image</button> 
      <button onclick="generateText()">Download as text</button>
      <div id="pageSettings">
        <label><input type="checkbox" id="hideDetails" checked>Hide details</label>
        <select id="sortOrder">
          <option value="lastUpdate">Last updated</option>
          <option value="discountLtoH">Discount: Low to High</option>
          <option value="discountHtoL" selected>Discount: High to Low</option>
          <option value="priceLtoH">Price: Low to High</option>
          <option value="priceHtoL">Price: High to Low</option>
        </select>
      </div>
    </aside>

    <div class="mainWrapper">
      <main></main>
    
      <!-- <nav>
        <button id="pageDown">&lt;&lt;</button> <span id="pageNum"></span> <button id="pageUp">&gt;&gt;</button>
      </nav> -->
    </div>

  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
  <script src="gsheets.js"></script>
  <script src="https://unpkg.com/@zumer/snapdom@latest/dist/snapdom.js"></script>
  <script src="script.js"></script>
</body>
</html>
