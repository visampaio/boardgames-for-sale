<!DOCTYPE html>
<html>
<head>
  <title>Boardgames for Sale</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <aside>
      <button onclick="generateImage()">Download as image</button>
      <div id="imageSettings">
        <label><input type="checkbox" id="title" checked>Title</label>
        <label><input type="checkbox" id="media" checked>Thumbnail</label>
        <label><input type="checkbox" id="percentageOff" checked>Discount</label>
        <label><input type="checkbox" id="msrp" checked>MSRP</label>
        <label><input type="checkbox" id="condition" checked>Condition</label>
        <label><input type="checkbox" id="info" checked>Notes</label>
      </div>
    </aside>

    <main></main>    

  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
  <script src="gsheets.js"></script>
  <script src="https://unpkg.com/@zumer/snapdom@latest/dist/snapdom.js"></script>
  <script src="script.js"></script>
</body>
</html>
